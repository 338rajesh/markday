[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markday"
version = "0.1.0"
description = "A local daily work logger with rich markdown editing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "markdown>=3.6",
    "pygments>=2.17",
    "pyinstaller>=6.20.0",
]

[project.scripts]
markday = "markday.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markday*"]

[tool.setuptools.package-data]
markday = ["../templates/*.html", "../static/**/*"]

[dependency-groups]
dev = [
    "svgwrite>=1.4.3",
]
